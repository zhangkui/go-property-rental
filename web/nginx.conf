map $http_accept $is_browser_navigation { default 0; ~*text/html 1; }
map $request_uri $admin_route { default /; /api/properties /properties; /api/facilities /facilities; /api/tenants /tenants; /api/leases /leases; /api/bills /bills; /api/work-orders /work-orders; /api/audit-logs /audits; }
server { listen 80; absolute_redirect off; charset utf-8; charset_types text/html text/css application/javascript application/json; root /usr/share/nginx/html; location / { try_files $uri $uri/ /index.html; } location /api/ { if ($is_browser_navigation) { return 302 $admin_route; } proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; } }