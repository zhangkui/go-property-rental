name: go-property-rental
services:
  mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rental}
      MYSQL_USER: ${MYSQL_USER:-rental}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rental}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes: [mysql_data:/var/lib/mysql]
    ports: ["${MYSQL_PORT:-23306}:3306"]
    healthcheck: {test: [CMD, mysqladmin, ping, -h, localhost], interval: 5s, timeout: 5s, retries: 30}
  redis:
    image: redis:7.4.10-bookworm
    volumes: [redis_data:/data]
    ports: ["${REDIS_PORT:-26379}:6379"]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 5s, retries: 30}
  api:
    build: {context: ., dockerfile: Dockerfile}
    environment:
      MYSQL_DSN: "${MYSQL_USER:-rental}:${MYSQL_PASSWORD:-rental}@tcp(mysql:3306)/${MYSQL_DATABASE:-rental}?parseTime=true&charset=utf8mb4"
      REDIS_ADDR: redis:6379
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    depends_on: {mysql: {condition: service_healthy}, redis: {condition: service_healthy}}
    ports: ["${API_PORT:-28081}:8080"]
    healthcheck: {test: [CMD, wget, -qO-, http://localhost:8080/health], interval: 5s, timeout: 3s, retries: 20}
  web:
    build: ./web
    depends_on: {api: {condition: service_healthy}}
    ports: ["${WEB_PORT:-28080}:80"]
volumes:
  mysql_data:
  redis_data:
